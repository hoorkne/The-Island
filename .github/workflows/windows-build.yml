name: Build RIO Island for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/RioIsland/RioIsland.csproj
      - name: Publish portable Windows x64 executable
        run: dotnet publish src/RioIsland/RioIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o dist
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath RIO-Island-Windows-x64.zip
      - name: Attach downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: RIO-Island-Windows-x64
          path: RIO-Island-Windows-x64.zip
          if-no-files-found: error
